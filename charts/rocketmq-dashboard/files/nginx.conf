worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Preserve HTTPS information supplied by the Istio gateway.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen {{ .Values.service.port }};
        server_name _;
        charset utf-8;
        root /usr/share/nginx/html;

        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_vary on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:{{ .Values.dashboard.port }};
        }

        # These two routes carry AI SSE streams; preserve their URI and query string.
        location ~ ^/api/ai/conversations/[0-9]+/messages$ {
            proxy_pass http://127.0.0.1:{{ .Values.dashboard.port }};
            proxy_buffering off;
            proxy_read_timeout 360s;
        }

        location ~ ^/api/ai/runs/[0-9]+/stream$ {
            proxy_pass http://127.0.0.1:{{ .Values.dashboard.port }};
            proxy_buffering off;
            proxy_read_timeout 360s;
        }

        location ~ ^/(api-docs|swagger-ui)(/|$) {
            proxy_pass http://127.0.0.1:{{ .Values.dashboard.port }};
        }

        location = /swagger-ui.html {
            proxy_pass http://127.0.0.1:{{ .Values.dashboard.port }};
        }

        location = /livez {
            proxy_pass http://127.0.0.1:{{ .Values.dashboard.port }};
        }

        location = /readyz {
            proxy_pass http://127.0.0.1:{{ .Values.dashboard.port }};
        }

        location ~ ^/actuator/health(/|$) {
            proxy_pass http://127.0.0.1:{{ .Values.dashboard.port }};
        }

        location = /actuator {
            return 404;
        }

        location /actuator/ {
            return 404;
        }
    }
}
