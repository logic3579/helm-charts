{{- if and .Values.mysql.enabled (not .Values.mysql.auth.existingSecret) }}
{{- $name := include "rocketmq-dashboard.mysql.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := $existing.data | default dict }}
{{- $rootPassword := .Values.mysql.auth.rootPassword | default (index $data .Values.mysql.auth.rootPasswordKey | default "" | b64dec) | default (randAlphaNum 32) }}
{{- $password := .Values.mysql.auth.password | default (index $data .Values.mysql.auth.passwordKey | default "" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "rocketmq-dashboard.mysql.labels" . | nindent 4 }}
  annotations:
    # Preserve credentials alongside retained MySQL PVCs on uninstall or mode changes.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.mysql.auth.rootPasswordKey }}: {{ $rootPassword | b64enc | quote }}
  {{ .Values.mysql.auth.passwordKey }}: {{ $password | b64enc | quote }}
{{- end }}
