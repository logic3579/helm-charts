{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rocketmq-dashboard.mysql.fullname" . }}
  labels:
    {{- include "rocketmq-dashboard.mysql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: {{ .Values.mysql.service.port }}
      targetPort: mysql
      protocol: TCP
  selector:
    {{- include "rocketmq-dashboard.mysql.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rocketmq-dashboard.mysql.fullname" . }}-headless
  labels:
    {{- include "rocketmq-dashboard.mysql.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: mysql
      port: {{ .Values.mysql.service.port }}
      targetPort: mysql
      protocol: TCP
  selector:
    {{- include "rocketmq-dashboard.mysql.selectorLabels" . | nindent 4 }}
{{- end }}
